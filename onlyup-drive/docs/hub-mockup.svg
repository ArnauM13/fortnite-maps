<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160a28"/>
      <stop offset="60%" stop-color="#20103a"/>
      <stop offset="100%" stop-color="#2a0f30"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241338"/>
      <stop offset="100%" stop-color="#140a22"/>
    </linearGradient>
    <radialGradient id="pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d95" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h { font-weight: 800; }
      .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; }
      .lbl { font-size: 13px; fill: #cdbfe0; }
      .cap { font-size: 11px; fill: #8f81a6; letter-spacing:.08em; text-transform:uppercase; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- graella de terra outrun -->
  <g stroke="#3a2358" stroke-width="1.5" opacity="0.7">
    <path d="M0 700 L1600 700"/>
    <g>
      <path d="M0 760 L1600 760"/><path d="M0 840 L1600 840"/><path d="M0 940 L1600 940"/>
      <path d="M800 700 L400 1000"/><path d="M800 700 L1200 1000"/>
      <path d="M800 700 L120 1000"/><path d="M800 700 L1480 1000"/>
      <path d="M800 700 L640 1000"/><path d="M800 700 L960 1000"/>
    </g>
  </g>

  <!-- títol -->
  <text x="50" y="60" class="h" font-size="34" fill="#ffffff">HUB D'SPAWN <tspan fill="#ff2d95">·</tspan> <tspan fill="#00e5ff" font-size="20">maqueta de layout</tspan></text>
  <text x="52" y="86" class="cap">Only Up: Drive — el jugador apareix al centre; tot el que l'empeny a jugar és visible al voltant</text>

  <!-- ===== MUR DE LEADERBOARDS (esquerra) ===== -->
  <g>
    <rect x="40" y="130" width="470" height="330" rx="14" fill="#1c1030" stroke="#ff2d95" stroke-width="2" filter="url(#g)"/>
    <text x="64" y="164" class="h" font-size="18" fill="#ff2d95">🏁 MUR DE RÈCORDS</text>
    <text x="64" y="184" class="cap">5 leaderboards + perfil · leaderboard_manager</text>
    <!-- 5 mini boards -->
    <g>
      <g transform="translate(64,200)"><rect width="128" height="72" rx="8" fill="#120a22" stroke="#00e5ff" stroke-width="1.5"/><text x="10" y="22" class="lbl h">🏔️ Alçada</text><text x="10" y="42" class="mono lbl" font-size="11">1. 4400m</text><text x="10" y="58" class="mono lbl" font-size="11">2. 3980m</text></g>
      <g transform="translate(204,200)"><rect width="128" height="72" rx="8" fill="#120a22" stroke="#00e5ff" stroke-width="1.5"/><text x="10" y="22" class="lbl h">⏱️ Temps</text><text x="10" y="42" class="mono lbl" font-size="11">1. 7:12</text><text x="10" y="58" class="mono lbl" font-size="11">2. 8:03</text></g>
      <g transform="translate(344,200)"><rect width="128" height="72" rx="8" fill="#120a22" stroke="#ffd24d" stroke-width="1.5"/><text x="10" y="22" class="lbl h">🪙 Fitxes</text><text x="10" y="42" class="mono lbl" font-size="11">1. 131</text><text x="10" y="58" class="mono lbl" font-size="11">2. 118</text></g>
      <g transform="translate(64,286)"><rect width="128" height="72" rx="8" fill="#120a22" stroke="#ff7a00" stroke-width="1.5"/><text x="10" y="22" class="lbl h">🔥 Ratxa</text><text x="10" y="42" class="mono lbl" font-size="11">1. 6:40</text><text x="10" y="58" class="mono lbl" font-size="11">2. 5:12</text></g>
      <g transform="translate(204,286)"><rect width="128" height="72" rx="8" fill="#120a22" stroke="#39ff14" stroke-width="1.5"/><text x="10" y="22" class="lbl h">😇 Purs</text><text x="10" y="42" class="mono lbl" font-size="11">1. x12</text><text x="10" y="58" class="mono lbl" font-size="11">2. x9</text></g>
      <g transform="translate(344,286)"><rect width="128" height="72" rx="8" fill="#241338" stroke="#ff2d95" stroke-width="1.5"/><text x="10" y="20" class="lbl h" font-size="12">👤 El teu perfil</text><text x="10" y="40" class="mono lbl" font-size="11">Nivell 14</text><text x="10" y="55" class="mono" font-size="10.5" fill="#ff7ac0">Corredor Nocturn</text></g>
    </g>
    <text x="64" y="392" class="lbl" font-size="12">Veure't al rànquing (o just a sota del següent)</text>
    <text x="64" y="410" class="lbl" font-size="12">és el millor motor de "una altra".</text>
    <rect x="64" y="424" width="180" height="24" rx="12" fill="#00e5ff"/><text x="80" y="441" class="mono h" font-size="12" fill="#001">Board Net vs Garatge</text>
  </g>

  <!-- ===== GARATGE (dreta) ===== -->
  <g>
    <rect x="1090" y="130" width="470" height="330" rx="14" fill="#1c1030" stroke="#00e5ff" stroke-width="2" filter="url(#g)"/>
    <text x="1114" y="164" class="h" font-size="18" fill="#00e5ff">🔧 EL GARATGE</text>
    <text x="1114" y="184" class="cap">arbre "+1" · garage_upgrades · gasta Punts</text>
    <g font-size="12">
      <g transform="translate(1114,198)"><rect width="210" height="40" rx="8" fill="#120a22" stroke="#ff2d95" stroke-width="1.3"/><text x="12" y="17" class="lbl h">🔧 Motor</text><text x="12" y="32" class="lbl" font-size="10.5">+2% velocitat</text><text x="196" y="26" text-anchor="end" class="mono" fill="#00e5ff">3/5</text></g>
      <g transform="translate(1336,198)"><rect width="210" height="40" rx="8" fill="#120a22" stroke="#ff2d95" stroke-width="1.3"/><text x="12" y="17" class="lbl h">💨 Nitro</text><text x="12" y="32" class="lbl" font-size="10.5">+1 càrrega d'aire</text><text x="196" y="26" text-anchor="end" class="mono" fill="#00e5ff">1/3</text></g>
      <g transform="translate(1114,246)"><rect width="210" height="40" rx="8" fill="#120a22" stroke="#ffd24d" stroke-width="1.3"/><text x="12" y="17" class="lbl h">💰 Turbo-caixa</text><text x="12" y="32" class="lbl" font-size="10.5">+10% diners</text><text x="196" y="26" text-anchor="end" class="mono" fill="#00e5ff">4/5</text></g>
      <g transform="translate(1336,246)"><rect width="210" height="40" rx="8" fill="#120a22" stroke="#ffd24d" stroke-width="1.3"/><text x="12" y="17" class="lbl h">🧲 Imant</text><text x="12" y="32" class="lbl" font-size="10.5">+75 radi</text><text x="196" y="26" text-anchor="end" class="mono" fill="#00e5ff">2/4</text></g>
      <g transform="translate(1114,294)"><rect width="210" height="40" rx="8" fill="#120a22" stroke="#39ff14" stroke-width="1.3"/><text x="12" y="17" class="lbl h">⛽ Dipòsit</text><text x="12" y="32" class="lbl" font-size="10.5">−2 cost CP</text><text x="196" y="26" text-anchor="end" class="mono" fill="#00e5ff">1/3</text></g>
      <g transform="translate(1336,294)"><rect width="210" height="40" rx="8" fill="#120a22" stroke="#39ff14" stroke-width="1.3"/><text x="12" y="17" class="lbl h">🪂 Suspensió</text><text x="12" y="32" class="lbl" font-size="10.5">+0.1s aterratge</text><text x="196" y="26" text-anchor="end" class="mono" fill="#00e5ff">0/3</text></g>
    </g>
    <g transform="translate(1114,346)"><rect width="432" height="42" rx="10" fill="#2c1024" stroke="#ff2d95" stroke-width="2"/><text x="14" y="20" class="h" font-size="13" fill="#ff7ac0">✨ PRESTIGI</text><text x="14" y="35" class="lbl" font-size="11">reinicia l'arbre → +25% global permanent (∞)</text><text x="418" y="27" text-anchor="end" class="mono h" fill="#ff2d95">P.2</text></g>
    <text x="1114" y="410" class="lbl" font-size="12">Punts disponibles: <tspan class="mono h" fill="#00e5ff">+3</tspan> · guanyats pujant de nivell</text>
    <rect x="1114" y="424" width="220" height="24" rx="12" fill="#241338" stroke="#8f81a6"/><text x="1130" y="441" class="mono" font-size="11.5" fill="#cdbfe0">Conducció NO compta al board Net</text>
  </g>

  <!-- ===== TAULELL DE MISSIONS (centre-baix) ===== -->
  <g>
    <rect x="530" y="500" width="540" height="230" rx="14" fill="#1c1030" stroke="#9b59b6" stroke-width="2" filter="url(#g)"/>
    <text x="554" y="534" class="h" font-size="18" fill="#c98be0">📋 TAULELL DE MISSIONS</text>
    <text x="554" y="554" class="cap">daily_challenge_manager + accolades</text>
    <g font-size="11.5">
      <g transform="translate(554,566)"><rect width="160" height="140" rx="10" fill="#120a22" stroke="#00e5ff" stroke-width="1.3"/><text x="12" y="24" class="h" fill="#00e5ff" font-size="13">DIÀRIES</text><text x="12" y="46" class="lbl">☐ Arriba a secció 4</text><text x="12" y="66" class="lbl">☑ Recull 40 fitxes</text><text x="12" y="86" class="lbl">☐ Clear sense CP</text><text x="12" y="118" class="cap">roten 24h · +30 KM</text></g>
      <g transform="translate(724,566)"><rect width="160" height="140" rx="10" fill="#120a22" stroke="#ffd24d" stroke-width="1.3"/><text x="12" y="24" class="h" fill="#ffd24d" font-size="13">SETMANALS</text><text x="12" y="46" class="lbl">☐ Cim ×3</text><text x="12" y="66" class="lbl">☐ 200 fitxes totals</text><text x="12" y="86" class="lbl">☐ 5 diàries fetes</text><text x="12" y="118" class="cap">roten 7 dies · +KM</text></g>
      <g transform="translate(894,566)"><rect width="160" height="140" rx="10" fill="#120a22" stroke="#39ff14" stroke-width="1.3"/><text x="12" y="24" class="h" fill="#39ff14" font-size="13">CARRERA</text><text x="12" y="46" class="lbl">☑ Primer clear</text><text x="12" y="66" class="lbl">☐ Tots els secrets</text><text x="12" y="86" class="lbl">☐ Sub-8 min</text><text x="12" y="118" class="cap">una vegada · badge</text></g>
    </g>
  </g>

  <!-- ===== RECOMPENSES PER TEMPS (dreta-baix) ===== -->
  <g>
    <rect x="1090" y="500" width="470" height="230" rx="14" fill="#1c1030" stroke="#ff7a00" stroke-width="2" filter="url(#g)"/>
    <text x="1114" y="534" class="h" font-size="18" fill="#ff9a3d">⏳ RECOMPENSES PER TEMPS</text>
    <text x="1114" y="554" class="cap">session_rewards + login diari</text>
    <g class="mono" font-size="12" fill="#cdbfe0">
      <text x="1114" y="584">5 min ····· +10 KM  ✅</text>
      <text x="1114" y="608">10 min ···· +20 KM  ✅</text>
      <text x="1114" y="632">20 min ···· +40 KM  ▸ 6:12</text>
      <text x="1114" y="656">30/45/60 · +60/80/120 KM</text>
    </g>
    <rect x="1114" y="672" width="432" height="34" rx="10" fill="#241338" stroke="#ff7a00"/><text x="1130" y="694" class="lbl" font-size="12">🔥 Ratxa de login: <tspan class="h" fill="#ff9a3d">dia 4</tspan> · dia 7 = premi gros</text>
  </g>

  <!-- ===== SPAWN CENTRAL amb meet ===== -->
  <ellipse cx="290" cy="640" rx="170" ry="40" fill="url(#pink)"/>
  <ellipse cx="450" cy="660" rx="150" ry="36" fill="url(#cyan)"/>
  <g>
    <rect x="120" y="540" width="360" height="150" rx="16" fill="url(#floor)" stroke="#00e5ff" stroke-width="2"/>
    <text x="140" y="568" class="h" font-size="16" fill="#00e5ff">🚗 MEET / SPAWN</text>
    <text x="140" y="586" class="cap">vehicle_spawner: conduïbles</text>
    <!-- cotxes -->
    <g stroke-width="2">
      <g transform="translate(150,610)"><rect width="90" height="34" rx="10" fill="#241338" stroke="#ff2d95"/><circle cx="20" cy="38" r="9" fill="#05010f" stroke="#00e5ff"/><circle cx="70" cy="38" r="9" fill="#05010f" stroke="#00e5ff"/></g>
      <g transform="translate(260,610)"><rect width="90" height="34" rx="10" fill="#241338" stroke="#00e5ff"/><circle cx="20" cy="38" r="9" fill="#05010f" stroke="#ff2d95"/><circle cx="70" cy="38" r="9" fill="#05010f" stroke="#ff2d95"/></g>
      <g transform="translate(370,614)"><rect width="70" height="28" rx="9" fill="#241338" stroke="#ffd24d"/><circle cx="16" cy="32" r="8" fill="#05010f" stroke="#ffd24d"/><circle cx="56" cy="32" r="8" fill="#05010f" stroke="#ffd24d"/></g>
    </g>
  </g>

  <!-- ===== START CLIMB (fletxa amunt, centre) ===== -->
  <g transform="translate(650,760)">
    <rect x="0" y="0" width="300" height="180" rx="16" fill="#2c1024" stroke="#ff2d95" stroke-width="2.5" filter="url(#g)"/>
    <text x="150" y="46" text-anchor="middle" class="h" font-size="22" fill="#ffffff">▲ COMENÇA L'ASCENS</text>
    <text x="150" y="72" text-anchor="middle" class="cap">torre de 4400m · 7 seccions</text>
    <g transform="translate(150,120)" filter="url(#g)">
      <path d="M0 40 L-34 40 L-34 10 L-60 10 L0 -40 L60 10 L34 10 L34 40 Z" fill="#ff2d95" stroke="#00e5ff" stroke-width="3"/>
    </g>
    <text x="150" y="172" text-anchor="middle" class="lbl" font-size="12">Toggle: <tspan fill="#39ff14">Sortida Neta</tspan> / <tspan fill="#00e5ff">Garatge</tspan></text>
  </g>

  <!-- fletxes de relació (degoteig "+1") -->
  <g class="mono" font-size="12" fill="#ff7ac0">
    <text x="510" y="300" text-anchor="middle">← veus</text>
    <text x="1075" y="300" text-anchor="middle">gastes →</text>
  </g>

  <text x="800" y="985" text-anchor="middle" class="cap">Tot visible al voltant de l'spawn → sempre hi ha un "+1" a la vista i una raó per tornar a pujar</text>
</svg>
