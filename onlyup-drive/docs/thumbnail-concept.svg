<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Arial Black, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0a4a"/>
      <stop offset="35%" stop-color="#7d1a6e"/>
      <stop offset="60%" stop-color="#e0417a"/>
      <stop offset="80%" stop-color="#ff7a3d"/>
      <stop offset="100%" stop-color="#ffd24d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2b0"/>
      <stop offset="55%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#66e0ff"/>
      <stop offset="55%" stop-color="#0a2a6a"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowbig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cel -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Sol amb franges -->
  <g filter="url(#glowbig)">
    <circle cx="960" cy="640" r="360" fill="url(#sun)"/>
  </g>
  <g fill="#1b0730">
    <rect x="560" y="640" width="800" height="18"/>
    <rect x="560" y="686" width="800" height="24"/>
    <rect x="560" y="742" width="800" height="32"/>
    <rect x="560" y="808" width="800" height="44"/>
    <rect x="560" y="884" width="800" height="60"/>
  </g>

  <!-- Graella de neó a l'horitzó -->
  <g stroke="#00e5ff" stroke-width="2" opacity="0.55" filter="url(#glow)">
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="0" y1="948" x2="1920" y2="948"/>
    <line x1="0" y1="1006" x2="1920" y2="1006"/>
    <line x1="0" y1="1074" x2="1920" y2="1074"/>
    <line x1="960" y1="900" x2="960" y2="1080"/>
    <line x1="960" y1="900" x2="360" y2="1080"/>
    <line x1="960" y1="900" x2="1560" y2="1080"/>
    <line x1="960" y1="900" x2="-260" y2="1080"/>
    <line x1="960" y1="900" x2="2180" y2="1080"/>
    <line x1="960" y1="900" x2="60" y2="1080"/>
    <line x1="960" y1="900" x2="1860" y2="1080"/>
  </g>

  <!-- Torre d'autopista en contrapicat (diagonal cap al sol) -->
  <g>
    <!-- pila de "cotxes"/plataformes ascendint -->
    <g stroke="#ff2d95" stroke-width="4" filter="url(#glow)">
      <rect x="720" y="900" width="300" height="70" rx="10" fill="#141026"/>
      <rect x="770" y="812" width="300" height="66" rx="10" fill="#171233"/>
      <rect x="700" y="726" width="290" height="60" rx="10" fill="#141026"/>
      <rect x="800" y="642" width="280" height="56" rx="10" fill="#171233"/>
      <rect x="720" y="560" width="270" height="52" rx="10" fill="#141026"/>
      <rect x="820" y="482" width="250" height="48" rx="10" fill="#171233"/>
      <rect x="740" y="408" width="240" height="44" rx="10" fill="#141026"/>
      <rect x="836" y="340" width="220" height="40" rx="10" fill="#171233"/>
    </g>
    <!-- vores cian (camí) -->
    <g stroke="#00e5ff" stroke-width="5" filter="url(#glow)">
      <line x1="720" y1="900" x2="1020" y2="900"/>
      <line x1="770" y1="812" x2="1070" y2="812"/>
      <line x1="700" y1="726" x2="990" y2="726"/>
      <line x1="800" y1="642" x2="1080" y2="642"/>
      <line x1="720" y1="560" x2="990" y2="560"/>
      <line x1="820" y1="482" x2="1070" y2="482"/>
      <line x1="740" y1="408" x2="980" y2="408"/>
      <line x1="836" y1="340" x2="1056" y2="340"/>
    </g>
  </g>

  <!-- Silueta del jugador saltant dalt de tot, retallada contra el sol -->
  <g fill="#0a0418" filter="url(#glow)">
    <circle cx="946" cy="300" r="16"/>
    <rect x="936" y="316" width="20" height="34" rx="6"/>
    <rect x="918" y="322" width="20" height="10" rx="5" transform="rotate(-30 928 327)"/>
    <rect x="954" y="320" width="20" height="10" rx="5" transform="rotate(25 964 325)"/>
    <rect x="934" y="348" width="10" height="22" rx="4" transform="rotate(-18 939 359)"/>
    <rect x="948" y="348" width="10" height="22" rx="4" transform="rotate(20 953 359)"/>
  </g>

  <!-- Text -->
  <g text-anchor="middle" filter="url(#glow)">
    <text x="960" y="150" font-size="120" letter-spacing="14" fill="url(#chrome)" stroke="#00e5ff" stroke-width="2">ONLY UP</text>
  </g>
  <g text-anchor="middle" filter="url(#glowbig)">
    <text x="960" y="1030" font-size="300" letter-spacing="18" fill="url(#chrome)" stroke="#ff2d95" stroke-width="4" font-style="italic">DRIVE</text>
  </g>

  <!-- Segell cantonada -->
  <g filter="url(#glow)">
    <text x="1850" y="120" text-anchor="end" font-size="90" fill="#00e5ff">↑</text>
    <text x="90" y="1010" font-size="70">🚗</text>
  </g>
</svg>
